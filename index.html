<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Pruning Calendar & Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .plant-card.completed {
      opacity: 0.82;
      border-color: #10b981;
      background-color: #f8fdfa;
    }
    .month-btn.active-month {
      ring-width: 2px;
      transform: scale(1.05);
      font-weight: 800;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-emerald-950 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col md:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="text-xl md:text-2xl font-extrabold tracking-tight flex items-center gap-2">
          <i class="fa-solid fa-calendar-check text-emerald-400"></i> Garden Pruning Calendar & Planner
        </h1>
        <p class="text-xs text-emerald-300/80" id="header-subtitle">Dynamic seasonal schedule</p>
      </div>

      <!-- Live Progress & Reset -->
      <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
        <div class="bg-emerald-900/80 px-4 py-2 rounded-xl flex items-center gap-3 border border-emerald-700/60">
          <div class="text-xs">
            <span class="text-emerald-200">Done:</span>
            <span id="progress-text" class="font-bold text-white ml-1">0 / 0</span>
          </div>
          <div class="w-28 md:w-36 bg-emerald-950 rounded-full h-2.5 overflow-hidden border border-emerald-800">
            <div id="progress-bar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- 12-Month Interactive Season Calendar Bar -->
    <section class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-3">
        <div>
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-regular fa-calendar-days text-emerald-700"></i> Seasonal Pruning Schedule
          </h2>
          <p class="text-xs text-slate-500">Select any month to reveal all eligible pruning jobs. Color coded by horticultural season.</p>
        </div>
        <div class="flex items-center gap-2 text-xs font-semibold">
          <button onclick="setFilterMode('current')" id="btn-show-current" class="px-3 py-1.5 rounded-lg bg-emerald-800 text-white shadow-sm transition">
            <i class="fa-solid fa-crosshairs mr-1"></i> Current Month
          </button>
          <button onclick="setFilterMode('all-year')" id="btn-show-all" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            View All Year
          </button>
        </div>
      </div>

      <!-- Month Buttons Grid -->
      <div class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-12 gap-1.5 text-xs font-bold" id="months-container">
        <!-- Generated via JS with seasonal color coding -->
      </div>

      <!-- Legend -->
      <div class="flex flex-wrap items-center gap-3 md:gap-5 mt-4 pt-3 border-t border-slate-100 text-[11px] font-medium text-slate-600">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-sky-200 border border-sky-400"></span> Winter (Dec–Feb)</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-200 border border-emerald-400"></span> Spring (Mar–May)</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-rose-200 border border-rose-400"></span> Summer (Jun–Aug)</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-amber-200 border border-amber-400"></span> Autumn (Sep–Nov)</span>
      </div>
    </section>

    <!-- Secondary Filters: Location, Tool, Search -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col lg:flex-row gap-3 justify-between items-stretch lg:items-center">
      
      <!-- Location Tabs -->
      <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
        <button onclick="setLocationFilter('all')" id="loc-all" class="px-3.5 py-1.5 rounded-lg bg-white text-emerald-900 shadow-sm transition">All Gardens</button>
        <button onclick="setLocationFilter('back')" id="loc-back" class="px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-emerald-900 transition">Back Garden</button>
        <button onclick="setLocationFilter('front')" id="loc-front" class="px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-emerald-900 transition">Front Garden</button>
      </div>

      <!-- Tool & Search Controls -->
      <div class="flex flex-col sm:flex-row items-center gap-2">
        <div class="relative w-full sm:w-48">
          <select id="tool-filter" onchange="setToolFilter(this.value)" class="w-full text-xs font-semibold bg-slate-100 text-slate-700 rounded-xl px-3 py-2 border-0 focus:ring-2 focus:ring-emerald-600">
            <option value="all">All Tools</option>
            <option value="Secateurs">Bypass Secateurs</option>
            <option value="Shears">Hedge Shears</option>
            <option value="Saw">Pruning Saw / Loppers</option>
          </select>
        </div>
        
        <div class="relative w-full sm:w-56">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input type="text" id="search-input" oninput="setSearchQuery(this.value)" placeholder="Search plant or job..." class="w-full text-xs bg-slate-100 text-slate-800 rounded-xl pl-8 pr-3 py-2 border-0 focus:ring-2 focus:ring-emerald-600">
        </div>
      </div>
    </section>

    <!-- Context Status Banner -->
    <div id="status-banner" class="mb-6 p-3.5 px-4 rounded-xl border flex items-center justify-between text-xs font-medium"></div>

    <!-- Plants Cards Grid -->
    <div id="plants-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </main>

    // State
    const currentRealMonth = new Date().getMonth() + 1; // 1-12
    let selectedMonth = currentRealMonth;
    let filterMode = 'current'; // 'current' or 'all-year'
    let selectedLocation = 'all';
    let selectedTool = 'all';
    let searchQuery = '';

    function getStorageKey(id) {
      return `prune_status_${id}`;
    }

    function isCompleted(id) {
      return localStorage.getItem(getStorageKey(id)) === 'done';
    }

    function toggleComplete(id) {
      if (isCompleted(id)) {
        localStorage.removeItem(getStorageKey(id));
      } else {
        localStorage.setItem(getStorageKey(id), 'done');
      }
      render();
    }

    function saveNote(id, text) {
      localStorage.setItem(`prune_note_${id}`, text);
    }

    function getNote(id) {
      return localStorage.getItem(`prune_note_${id}`) || '';
    }

    function buildMonthButtons() {
      const container = document.getElementById('months-container');
      container.innerHTML = '';

      MONTHS.forEach(m => {
        const isCurrent = (m.num === currentRealMonth);
        const isSelected = (filterMode === 'current' && m.num === selectedMonth);

        const btn = document.createElement('button');
        btn.id = `month-btn-${m.num}`;
        btn.className = `month-btn py-2 px-1 rounded-xl border flex flex-col items-center justify-center transition-all ${m.bg} ${isSelected ? 'active-month ring-2 ring-slate-800' : ''}`;
        
        btn.innerHTML = `
          <span class="text-[10px] tracking-wider uppercase opacity-75">${m.name}</span>
          <span class="text-[11px] font-black">${m.season}</span>
          ${isCurrent ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-600 mt-1" title="Current Month"></span>' : ''}
        `;

        btn.onclick = () => {
          selectedMonth = m.num;
          filterMode = 'current';
          render();
        };

        container.appendChild(btn);
      });
    }

    function setFilterMode(mode) {
      filterMode = mode;
      if (mode === 'current') {
        selectedMonth = currentRealMonth;
      }
      render();
    }

    function setLocationFilter(loc) {
      selectedLocation = loc;
      ['all', 'back', 'front'].forEach(k => {
        const btn = document.getElementById(`loc-${k}`);
        if (k === loc) {
          btn.className = "px-3.5 py-1.5 rounded-lg bg-white text-emerald-900 shadow-sm transition";
        } else {
          btn.className = "px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-emerald-900 transition";
        }
      });
      render();
    }

    function setToolFilter(tool) {
      selectedTool = tool;
      render();
    }

    function setSearchQuery(q) {
      searchQuery = q.toLowerCase().trim();
      render();
    }

    function updateHeaderAndBanner(filteredPlants) {
      const activeMonthObj = MONTHS.find(m => m.num === selectedMonth);
      const isCurrent = (selectedMonth === currentRealMonth);

      const banner = document.getElementById('status-banner');
      const subtitle = document.getElementById('header-subtitle');

      if (filterMode === 'all-year') {
        subtitle.innerText = "Displaying all 20 garden plants across the whole year";
        banner.className = "mb-6 p-3.5 px-4 rounded-xl border bg-slate-200 border-slate-300 text-slate-800 flex items-center justify-between text-xs font-semibold";
        banner.innerHTML = `
          <span><i class="fa-solid fa-list mr-1.5 text-slate-600"></i> Showing all plants (Full Year Overview). Select any month above to filter.</span>
          <span class="bg-slate-300 px-2.5 py-1 rounded-md text-slate-800">${filteredPlants.length} Plants</span>
        `;
      } else {
        subtitle.innerText = `Showing tasks for ${activeMonthObj.name} (${activeMonthObj.season})${isCurrent ? ' - Current Month' : ''}`;
        
        let bannerStyle = "bg-amber-50 border-amber-300 text-amber-950";
        if (activeMonthObj.season === 'Winter') bannerStyle = "bg-sky-50 border-sky-300 text-sky-950";
        if (activeMonthObj.season === 'Spring') bannerStyle = "bg-emerald-50 border-emerald-300 text-emerald-950";
        if (activeMonthObj.season === 'Summer') bannerStyle = "bg-rose-50 border-rose-300 text-rose-950";

        banner.className = `mb-6 p-3.5 px-4 rounded-xl border flex items-center justify-between text-xs font-semibold ${bannerStyle}`;
        banner.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full ${isCurrent ? 'bg-emerald-500 animate-ping' : 'bg-slate-400'}"></span>
            <span>Pruning tasks for <strong>${activeMonthObj.name}</strong> (${activeMonthObj.season})${isCurrent ? ' — Active This Month' : ''}</span>
          </div>
          <span class="px-2.5 py-1 rounded-md bg-white/80 border text-[11px] font-bold">${filteredPlants.length} Actionable</span>
        `;
      }

      // Update button state styles
      document.getElementById('btn-show-current').className = (filterMode === 'current' && selectedMonth === currentRealMonth) 
        ? "px-3 py-1.5 rounded-lg bg-emerald-800 text-white shadow-sm transition"
        : "px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition";

      document.getElementById('btn-show-all').className = (filterMode === 'all-year')
        ? "px-3 py-1.5 rounded-lg bg-slate-800 text-white shadow-sm transition"
        : "px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition";

      MONTHS.forEach(m => {
        const btn = document.getElementById(`month-btn-${m.num}`);
        if (btn) {
          if (filterMode === 'current' && m.num === selectedMonth) {
            btn.classList.add('active-month', 'ring-2', 'ring-slate-800');
          } else {
            btn.classList.remove('active-month', 'ring-2', 'ring-slate-800');
          }
        }
      });

      // Overall completed stats
      const totalDone = plants.filter(p => isCompleted(p.id)).length;
      const pct = Math.round((totalDone / plants.length) * 100);
      document.getElementById('progress-text').innerText = `${totalDone} / ${plants.length}`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function render() {
      const grid = document.getElementById('plants-grid');
      grid.innerHTML = '';

      const filtered = plants.filter(p => {
        // Month / Season match
        const matchesMonth = (filterMode === 'all-year') || p.months.includes(selectedMonth);

        // Location match
        const matchesLoc = (selectedLocation === 'all') || (p.location === selectedLocation);

        // Tool match
        const matchesTool = (selectedTool === 'all') || p.tools.toLowerCase().includes(selectedTool.toLowerCase());

        // Search match
        const matchesSearch = !searchQuery || 
          p.name.toLowerCase().includes(searchQuery) ||
          p.latin.toLowerCase().includes(searchQuery) ||
          p.photoDesc.toLowerCase().includes(searchQuery) ||
          p.steps.some(s => s.toLowerCase().includes(searchQuery));

        return matchesMonth && matchesLoc && matchesTool && matchesSearch;
      });

      updateHeaderAndBanner(filtered);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200 p-8">
            <i class="fa-solid fa-bed text-4xl text-slate-300 mb-3"></i>
            <h3 class="font-bold text-slate-700 text-base mb-1">No Pruning Tasks Due</h3>
            <p class="text-xs text-slate-500 max-w-md mx-auto">None of your garden plants are scheduled for pruning under the selected month or filters. Let the garden rest, or switch to 'View All Year' above.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(plant => {
        const done = isCompleted(plant.id);
        const note = getNote(plant.id);
        const card = document.createElement('div');
        card.className = `plant-card bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 transition duration-200 flex flex-col justify-between ${done ? 'completed' : ''}`;

        const stepsList = plant.steps.map((step, idx) => `
          <li class="flex items-start gap-2">
            <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold shrink-0 mt-0.5">${idx + 1}</span>
            <span class="text-slate-600 text-xs leading-relaxed">${step}</span>
          </li>
        `).join('');

        // Clean image view: NO FILENAME DISPLAYED on image
        card.innerHTML = `
          <div>
            <div class="relative h-60 bg-slate-100 overflow-hidden">
              <img 
                src="${plant.localImage}" 
                alt="${plant.name}" 
                class="w-full h-full object-cover"
                onerror="this.onerror=null; this.src='${plant.fallbackImage}';" 
              />
              <span class="absolute top-3 left-3 text-xs font-bold px-3 py-1 rounded-full border ${plant.seasonBadgeClass} shadow-sm backdrop-blur-sm bg-opacity-95">
                ${plant.season}
              </span>
              <span class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-0.5 rounded bg-black/60 text-white backdrop-blur-sm">
                ${plant.location === 'back' ? 'Back Garden' : 'Front Garden'}
              </span>
              
              <!-- Subtle plant description only (filename removed) -->
              <div class="absolute bottom-2 left-3 right-3 bg-black/75 backdrop-blur-sm text-white text-[11px] px-3 py-1.5 rounded-lg flex items-center justify-between">
                <span class="truncate text-slate-200">${plant.photoDesc}</span>
                <span class="text-emerald-300 font-bold ml-2 shrink-0">${plant.months.map(m => MONTHS[m-1].name).join(', ')}</span>
              </div>
            </div>

            <!-- Card Body -->
            <div class="p-5">
              <div class="flex justify-between items-start gap-2 mb-2">
                <div>
                  <h3 class="font-bold text-slate-800 text-lg leading-tight">${plant.name}</h3>
                  <p class="text-xs italic text-slate-400 mt-0.5">${plant.latin}</p>
                </div>
                <button onclick="toggleComplete('${plant.id}')" title="Mark as Done" class="p-2.5 rounded-xl transition ${done ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-emerald-50 hover:text-emerald-600'}">
                  <i class="fa-solid fa-check text-base"></i>
                </button>
              </div>

              <div class="space-y-3 mt-3">
                <!-- Step-by-Step Instructions -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                  <span class="font-bold text-slate-700 text-xs block mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-emerald-700"></i> Step-by-Step Pruning:
                  </span>
                  <ul class="space-y-1.5">
                    ${stepsList}
                  </ul>
                </div>

                <!-- Golden Rule Warning -->
                <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200/80 text-amber-950 text-xs">
                  <span class="font-bold block mb-0.5 text-amber-800">
                    <i class="fa-solid fa-triangle-exclamation mr-1 text-amber-600"></i>Key Rule:
                  </span>
                  <p class="leading-relaxed text-[11px]">${plant.rule}</p>
                </div>

                <!-- Notes / Date Log -->
                <div class="pt-1">
                  <div class="flex items-center justify-between text-[11px] text-slate-500 mb-1">
                    <span class="font-medium"><i class="fa-regular fa-pen-to-square mr-1"></i>My Pruning Notes / Date:</span>
                  </div>
                  <input 
                    type="text" 
                    placeholder="e.g. Trimmed by 20 cm on 15 Sept..." 
                    value="${note}" 
                    onchange="saveNote('${plant.id}', this.value)"
                    class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 focus:bg-white focus:ring-1 focus:ring-emerald-600 focus:border-emerald-600"
                  />
                </div>
              </div>
            </div>
          </div>

          <!-- Footer -->
          <div class="px-5 pb-4 pt-3 border-t border-slate-100 flex items-center justify-between bg-slate-50/60">
            <span class="text-[11px] text-slate-500 font-medium flex items-center gap-1.5 truncate max-w-[58%]">
              <i class="fa-solid fa-wrench text-slate-400"></i> ${plant.tools}
            </span>
            <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(plant.videoQuery)}" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="inline-flex items-center gap-1.5 text-xs font-bold text-rose-600 hover:text-rose-700 hover:underline">
              <i class="fa-brands fa-youtube text-base"></i> Video Guide
            </a>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Initialize
    buildMonthButtons();
    render();
  </script>
</body>
</html>
