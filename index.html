        </h1>
        <p class="text-xs text-emerald-200">Verified plant-by-plant instructions mapped directly to your photos</p>

      <!-- Live Progress Bar -->
      <div class="bg-emerald-950/70 p-2.5 px-4 rounded-xl flex items-center gap-4 border border-emerald-700/60 w-full md:w-auto">
        <div class="text-xs md:text-sm">

          <span id="progress-text" class="font-bold text-white ml-1">0 / 0</span>

  </header>

      <div class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
        
        <!-- Location Tabs -->
        <div class="flex bg-slate-100 p-1 rounded-xl text-xs md:text-sm font-semibold w-full md:w-auto">
          <button onclick="setLocationFilter('all')" id="loc-all" class="flex-1 md:flex-initial px-3 md:px-4 py-2 rounded-lg bg-white text-emerald-800 shadow-sm transition">All Areas</button>
          <button onclick="setLocationFilter('back')" id="loc-back" class="flex-1 md:flex-initial px-3 md:px-4 py-2 rounded-lg text-slate-600 hover:text-emerald-800 transition">Back Garden (10)</button>
          <button onclick="setLocationFilter('front')" id="loc-front" class="flex-1 md:flex-initial px-3 md:px-4 py-2 rounded-lg text-slate-600 hover:text-emerald-800 transition">Front Garden (10)</button>
        </div>

        <!-- Season Selector -->
        <div class="flex flex-wrap gap-1.5 md:gap-2 text-xs font-semibold w-full md:w-auto">
          <button onclick="setSeasonFilter('all')" id="season-all" class="px-3 py-2 rounded-lg bg-slate-800 text-white transition ring-2 ring-offset-1 ring-slate-800">All Timings</button>
          <button onclick="setSeasonFilter('now')" id="season-now" class="px-3 py-2 rounded-lg bg-amber-100 text-amber-900 hover:bg-amber-200 border border-amber-300 transition flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Act Now (Autumn)
          </button>
          <button onclick="setSeasonFilter('winter')" id="season-winter" class="px-3 py-2 rounded-lg bg-sky-100 text-sky-900 hover:bg-sky-200 border border-sky-300 transition">
            <i class="fa-regular fa-snowflake mr-1"></i> Winter Dormant
          </button>
          <button onclick="setSeasonFilter('spring')" id="season-spring" class="px-3 py-2 rounded-lg bg-emerald-100 text-emerald-900 hover:bg-emerald-200 border border-emerald-300 transition">
            <i class="fa-solid fa-seedling mr-1"></i> Spring (Mar-Apr)
          </button>
          <button onclick="setSeasonFilter('summer')" id="season-summer" class="px-3 py-2 rounded-lg bg-rose-100 text-rose-900 hover:bg-rose-200 border border-rose-300 transition">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Summer Warning
          </button>
        </div>
      </div>
    </section>

    <!-- Cards Grid -->

    let currentLoc = 'all';
    let currentSeason = 'all';

    function getStorageKey(id) {
      return `prune_status_${id}`;
    }

    function isCompleted(id) {
      return localStorage.getItem(getStorageKey(id)) === 'done';
    }

    function toggleComplete(id) {
      if (isCompleted(id)) {
        localStorage.removeItem(getStorageKey(id));
      } else {
        localStorage.setItem(getStorageKey(id), 'done');
      }
      renderCards();
      updateProgress();
    }

    function setLocationFilter(loc) {
      currentLoc = loc;
      ['all', 'back', 'front'].forEach(k => {
        const btn = document.getElementById(`loc-${k}`);
        if (k === loc) {
          btn.className = "flex-1 md:flex-initial px-3 md:px-4 py-2 rounded-lg bg-white text-emerald-800 shadow-sm transition";
        } else {
          btn.className = "flex-1 md:flex-initial px-3 md:px-4 py-2 rounded-lg text-slate-600 hover:text-emerald-800 transition";
        }
      });
      renderCards();
    }

    function setSeasonFilter(season) {
      currentSeason = season;
      ['all', 'now', 'winter', 'spring', 'summer'].forEach(s => {
        const btn = document.getElementById(`season-${s}`);
        if (s === season) {
          btn.classList.add('ring-2', 'ring-offset-1', 'ring-slate-800');
        } else {
          btn.classList.remove('ring-2', 'ring-offset-1', 'ring-slate-800');
        }
      });
      renderCards();
    }

    function updateProgress() {
      const completedCount = plants.filter(p => isCompleted(p.id)).length;
      const total = plants.length;
      const pct = total === 0 ? 0 : Math.round((completedCount / total) * 100);
      document.getElementById('progress-text').innerText = `${completedCount} / ${total}`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function renderCards() {
      const grid = document.getElementById('plants-grid');
      grid.innerHTML = '';

      const filtered = plants.filter(p => {
        const matchesLoc = (currentLoc === 'all' || p.location === currentLoc);
        const matchesSeason = (currentSeason === 'all' || p.season === currentSeason);
        return matchesLoc && matchesSeason;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 font-semibold text-sm">No plants match the selected filter combination.</div>`;
        return;
      }

      filtered.forEach(plant => {
        const done = isCompleted(plant.id);
        const card = document.createElement('div');
        card.className = `plant-card bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 transition duration-200 flex flex-col justify-between ${done ? 'completed' : ''}`;
        
        const stepsList = plant.steps.map((step, idx) => `
          <li class="flex items-start gap-2">
            <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold shrink-0 mt-0.5">${idx + 1}</span>
            <span class="text-slate-600 text-xs leading-relaxed">${step}</span>
          </li>
        `).join('');

        card.innerHTML = `
          <div>
            <!-- Image with automatic fallback -->
            <div class="relative h-60 bg-slate-100 overflow-hidden">
              <img 
                src="${plant.localImage}" 
                alt="${plant.name}" 
                class="w-full h-full object-cover"
                onerror="this.onerror=null; this.src='${plant.fallbackImage}';" 
              />
              <span class="absolute top-3 left-3 text-xs font-bold px-2.5 py-1 rounded-full border ${plant.seasonBadgeClass} shadow-sm backdrop-blur-sm bg-opacity-95">
                ${plant.seasonLabel}
              </span>
              <span class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-1 rounded bg-black/60 text-white backdrop-blur-sm">
                ${plant.location === 'back' ? 'Back Garden' : 'Front Garden'}
              </span>
              <div class="absolute bottom-2 left-3 right-3 bg-black/80 backdrop-blur-sm text-white text-[11px] px-2.5 py-1 rounded flex items-center justify-between">
                <span class="font-mono text-emerald-300 font-medium truncate">${plant.photoRef}</span>
                <span class="truncate ml-2 text-slate-300 text-[10px]">${plant.photoDesc}</span>
              </div>
            </div>

            <!-- Content Area -->
            <div class="p-5">
              <div class="flex justify-between items-start gap-2 mb-2">
                <div>
                  <h3 class="font-bold text-slate-800 text-lg leading-tight">${plant.name}</h3>
                  <p class="text-xs italic text-slate-400 mt-0.5">${plant.latin}</p>
                </div>
                <button onclick="toggleComplete('${plant.id}')" title="Mark as Done" class="p-2.5 rounded-xl transition ${done ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-400 hover:bg-emerald-50 hover:text-emerald-600'}">
                  <i class="fa-solid fa-check text-base"></i>
                </button>
              </div>

              <div class="space-y-3">
                <!-- Step-by-Step Instructions -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                  <span class="font-bold text-slate-700 text-xs block mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-emerald-600"></i> Step-by-Step Instructions:
                  </span>
                  <ul class="space-y-1.5">
                    ${stepsList}
                  </ul>
                </div>

                <!-- Golden Rule Warning -->
                <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200/70 text-amber-950 text-xs">
                  <span class="font-bold block mb-0.5 text-amber-800">
                    <i class="fa-solid fa-triangle-exclamation mr-1 text-amber-600"></i>Key Rule:
                  </span>
                  <p class="leading-relaxed text-[11px]">${plant.rule}</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Footer with Tools and Video Link -->
          <div class="px-5 pb-5 pt-3 border-t border-slate-100 flex items-center justify-between bg-slate-50/50">
            <span class="text-[11px] text-slate-500 font-medium flex items-center gap-1.5 truncate max-w-[55%]">
              <i class="fa-solid fa-toolbox text-slate-400"></i> ${plant.tools}
            </span>
            <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(plant.videoQuery)}" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="inline-flex items-center gap-1.5 text-xs font-bold text-rose-600 hover:text-rose-700 hover:underline">
              <i class="fa-brands fa-youtube text-base"></i> Watch Guide
            </a>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    renderCards();
    updateProgress();
  </script>
